# Herdr works without configuration. Keep keybindings commented out until a
# deliberate override from the built-in tmux-like defaults is needed.
#
# Print the current complete defaults with:
#   herdr --default-config
#
# Show the active keybindings inside Herdr with prefix+?.

# [keys]
# prefix = "ctrl+b"
# new_tab = "prefix+c"
# next_tab = "prefix+n"
# previous_tab = "prefix+p"
# focus_pane_left = "prefix+h"
# focus_pane_down = "prefix+j"
# focus_pane_up = "prefix+k"
# focus_pane_right = "prefix+l"
# split_horizontal = "prefix+minus"
# split_vertical = "prefix+v"
